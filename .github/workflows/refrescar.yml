name: Refrescar el catálogo

# Regenera los JSON estáticos (shards, scopes, manifiesto) desde las fuentes de
# origen y hace commit si algo cambió. Cloudflare Pages redespliega solo.
#
# SIN ESTO: los JSON del repo son una foto. La app se enteraría de los canales
# nuevos solo cuando alguien ejecutara `node tools/generar.js` a mano.

on:
  schedule:
    - cron: '17 5 * * *'      # todos los días a las 05:17 UTC
  workflow_dispatch:           # y a mano cuando haga falta

permissions:
  contents: write

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar el catálogo
        run: node tools/generar.js

      - name: ¿Cambió algo?
        id: diff
        run: |
          if git diff --quiet; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
          else
            echo "cambios=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.diff.outputs.cambios == 'si'
        run: |
          git config user.email  "acciones@users.noreply.github.com"
          git config user.name   "Refresco diario"
          git add -A
          git commit -m "Refresco diario del catálogo ($(date -u +%Y-%m-%d))"
          git push
