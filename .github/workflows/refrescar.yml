name: Refrescar el catálogo (LEGADO — fuentes de terceros)

# ⚠️ ESTO YA NO ES EL CAMINO NORMAL. NO SE EJECUTA SOLO.
#
# Este workflow regenera el catálogo desde `data_unificado.json` (belkaperu) y
# `canales-compacto.json` (cesopppplop): fuentes de TERCEROS, sin comprobar qué
# canales emiten. Escribía los mismos ficheros que el colector, así que si corría
# después lo pisaba todo.
#
# El camino bueno es `.github/workflows/colector.yml`: barre tu API, verifica qué
# canales emiten y publica solo esos.
#
# Se queda aquí, y solo a mano, como plan B si algún día la API no está disponible:
# sirve para volver al catálogo de terceros tal cual. Si lo lanzas, el colector lo
# corregirá en la siguiente pasada.

on:
  workflow_dispatch:           # SOLO a mano. Sin cron, a propósito.

permissions:
  contents: write

jobs:
  refrescar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aviso
        run: |
          echo "::warning::Estás publicando el catálogo de TERCEROS sin verificar. El camino normal es el workflow «Colector de canales»."

      - name: Generar el catálogo
        run: node tools/generar.js

      - name: ¿Cambió algo?
        id: diff
        run: |
          if git diff --quiet; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
          else
            echo "cambios=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.diff.outputs.cambios == 'si'
        run: |
          git config user.email  "acciones@users.noreply.github.com"
          git config user.name   "Refresco diario"
          git add -A
          git commit -m "Refresco diario del catálogo ($(date -u +%Y-%m-%d))"
          git push
